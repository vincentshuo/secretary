name: Publish Secretary reports
on:
  push:
    branches: [main]
    paths:
      - 'surfaces/gui/public/youtube/**'
      - '.github/workflows/report-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: report-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}youtube/
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir site
          cp -R surfaces/gui/public/youtube site/youtube
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy reports
        id: deploy
        uses: actions/deploy-pages@v4
